# CO3085 Course Assistant semantic CFG
# Syntax: NON_TERMINAL -> symbols | another alternative
# Quoted lowercase values are terminals. A blank alternative is epsilon.
# The intent is encoded by the Q_* child selected below; entity values are
# captured by named constituents such as WEEK_ENTITY and TOPIC_ENTITY.
#
# Phase 1: built on the frozen reference grammar (branch `sample`,
# docs/sample-src/data/grammar.cfg) plus the accepted alternatives from
# PR #1 (Bảo), #2 (Bách) and #3 (Khoa). What was accepted or rejected, and
# why: docs/progress/done/phase1-grammar-merge.md.

%start S

