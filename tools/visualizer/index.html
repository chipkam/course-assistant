<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pipeline Visualizer</title>
<style>
:root {
  --bg: #03050b;
  --ink: #dbe6ff;
  --dim: #6f7ea6;
  --faint: rgba(130, 160, 255, .14);
  --panel: rgba(9, 14, 28, .78);
  --mono: "JetBrains Mono", "Cascadia Code", Consolas, ui-monospace, monospace;
  --sans: "Segoe UI", system-ui, -apple-system, sans-serif;
  --ok: #4ade80;
  --bad: #f87171;
  --warn: #fbbf24;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: radial-gradient(1200px 700px at 50% 35%, #0b1430 0%, var(--bg) 70%) fixed, var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  overflow: hidden;
  display: grid;
  grid-template-rows: 64px 1fr 104px;
  user-select: none;
}
button { font: inherit; color: inherit; cursor: pointer; }

/* ── top bar ───────────────────────────────────────────── */
#bar {
  display: flex; align-items: center; gap: 12px;
  padding: 0 18px;
  border-bottom: 1px solid var(--faint);
  background: linear-gradient(180deg, rgba(10, 16, 34, .9), rgba(4, 7, 15, .6));
  position: relative; z-index: 20;
}
.chip {
  font: 600 11px var(--mono); letter-spacing: .04em;
  padding: 5px 10px; border-radius: 99px;
  border: 1px solid var(--faint); color: var(--dim);
  white-space: nowrap;
}
.chip b { color: #8ab4ff; font-weight: 700; }
.ctl {
  height: 36px; min-width: 36px; padding: 0 12px;
  border-radius: 10px; border: 1px solid rgba(130, 160, 255, .22);
  background: rgba(30, 44, 80, .35);
  font: 600 13px var(--mono);
  transition: background .2s, border-color .2s, box-shadow .2s;
}
.ctl:hover { background: rgba(70, 100, 180, .35); border-color: #8ab4ff; }
.ctl.on { border-color: #f472b6; box-shadow: 0 0 18px -4px #f472b6; color: #ffd1ea; }
#sentence {
  flex: 1; min-width: 0;
  display: flex; align-items: center; gap: 12px;
  justify-content: center;
}
#q {
  font: 600 21px var(--sans);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  max-width: 62vw;
  text-shadow: 0 0 18px rgba(138, 180, 255, .45);
  cursor: pointer;
}
#qi { font: 600 12px var(--mono); color: var(--dim); }
#steps { display: flex; gap: 3px; align-items: center; }
#steps i {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--c, #445); opacity: .25; transition: opacity .2s, transform .2s;
}
#steps i.done { opacity: .8; }
#steps i.now { opacity: 1; transform: scale(1.6); box-shadow: 0 0 10px var(--c); }

/* ── stage ─────────────────────────────────────────────── */
#viewport { position: relative; overflow: hidden; }
#world { position: absolute; inset: 0; }
#world.shake { animation: shake .32s; }
@keyframes shake {
  20% { transform: translate(3px, -2px); } 40% { transform: translate(-3px, 2px); }
  60% { transform: translate(2px, 1px); } 80% { transform: translate(-1px, -1px); }
}
canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#bg { z-index: 0; }
#fx { z-index: 50; }
#boxes { position: absolute; inset: 0; z-index: 10; }

.box {
  position: absolute;
  border-radius: 14px;
  border: 1px solid color-mix(in srgb, var(--c) 40%, transparent);
  background: linear-gradient(160deg, color-mix(in srgb, var(--c) 9%, rgba(10, 15, 30, .82)), rgba(6, 9, 18, .82));
  box-shadow: 0 0 30px -16px var(--c), inset 0 1px 0 rgba(255, 255, 255, .04);
  transition: border-color .35s, box-shadow .35s, opacity .35s;
  overflow: hidden;
}
.box.container {
  background: linear-gradient(160deg, color-mix(in srgb, var(--c) 6%, rgba(8, 12, 24, .45)), rgba(5, 8, 16, .35));
  border-style: solid;
}
.box.idle { opacity: .5; }
.box.idle.lit { opacity: 1; }
.box.active {
  border-color: var(--c);
  box-shadow: 0 0 0 1px var(--c), 0 0 46px -6px var(--c), inset 0 0 60px -30px var(--c);
}
.box.hit:not(.container) { animation: hit .55s cubic-bezier(.2, .9, .3, 1.4); }
.box.container.hit { animation: flash .6s; }
@keyframes hit { 0% { transform: scale(1); } 35% { transform: scale(1.045); } 100% { transform: scale(1); } }
@keyframes flash { 0% { box-shadow: 0 0 0 2px var(--c), 0 0 60px var(--c); } 100% {} }
.head {
  height: 28px; display: flex; align-items: center; gap: 8px;
  padding: 0 10px; white-space: nowrap;
}
.name { font: 700 12.5px var(--mono); color: var(--c); letter-spacing: .02em; }
.meta { font: 500 10px var(--mono); color: var(--dim); overflow: hidden; text-overflow: ellipsis; }
.grow { flex: 1; }
.hits {
  font: 700 10px var(--mono); color: var(--c);
  padding: 1px 7px; border-radius: 99px;
  background: color-mix(in srgb, var(--c) 14%, transparent);
  opacity: 0; transition: opacity .3s;
}
.hits.show { opacity: 1; }
.todo {
  font: 700 9px var(--mono); color: var(--warn);
  padding: 1px 6px; border-radius: 99px;
  border: 1px solid rgba(251, 191, 36, .4);
  background: repeating-linear-gradient(45deg, rgba(251, 191, 36, .22) 0 4px, transparent 4px 8px);
}
.core {
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--c); box-shadow: 0 0 12px var(--c);
  opacity: .55;
}
.box.active > .head .core { opacity: 1; animation: beat 1s infinite; }
@keyframes beat { 50% { transform: scale(1.5); } }
.body {
  position: absolute; left: 10px; right: 10px; top: 30px; bottom: 8px;
  display: flex; flex-wrap: wrap; align-content: flex-start; gap: 4px;
  overflow: hidden;
}
.tok, .pill {
  font: 600 11px var(--mono);
  padding: 2px 7px; border-radius: 6px;
  background: color-mix(in srgb, var(--c) 16%, transparent);
  border: 1px solid color-mix(in srgb, var(--c) 40%, transparent);
  color: color-mix(in srgb, var(--c) 70%, white);
  animation: pop .35s backwards;
}
@keyframes pop { from { transform: scale(.3) translateY(6px); opacity: 0; } }
.big {
  font: 800 26px var(--mono); color: var(--c);
  text-shadow: 0 0 22px var(--c);
  width: 100%;
}
.small { font: 500 10px var(--mono); color: var(--dim); width: 100%; }
.slot {
  flex: 1 1 30%; min-width: 0;
  border-radius: 8px; padding: 4px 6px;
  border: 1px dashed color-mix(in srgb, var(--c) 35%, transparent);
  font: 600 10px var(--mono); color: var(--dim);
  transition: background .3s, border-color .3s, color .3s;
}
.slot b { display: block; font-size: 13px; color: var(--ink); }
.slot.set { border-style: solid; border-color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); }
.slot.used { animation: used .9s; }
@keyframes used { 0%, 60% { box-shadow: 0 0 0 2px #e879f9, 0 0 26px #e879f9; } }
.file { opacity: .35; transition: opacity .3s, box-shadow .3s; }
.file.lit { opacity: 1; box-shadow: 0 0 16px -2px var(--c); }

/* ── payload card ──────────────────────────────────────── */
.card {
  position: absolute; z-index: 60;
  width: 360px; max-height: 300px; overflow: hidden;
  padding: 12px 14px 14px;
  border-radius: 16px;
  background: rgba(5, 8, 18, .93);
  border: 1px solid var(--k);
  box-shadow: 0 0 0 1px rgba(0, 0, 0, .5), 0 20px 60px -20px var(--k), 0 0 40px -10px var(--k);
  animation: cardin .38s cubic-bezier(.2, .9, .3, 1.3);
  pointer-events: none;
}
.card.out { animation: cardout .3s forwards; }
@keyframes cardin { from { opacity: 0; transform: translateY(14px) scale(.9); } }
@keyframes cardout { to { opacity: 0; transform: translateY(-10px) scale(.96); } }
.card .tag {
  display: inline-block; font: 800 10px var(--mono); letter-spacing: .14em;
  color: var(--k); margin-bottom: 8px;
}
.card .row { display: flex; flex-wrap: wrap; gap: 5px; }
.card .tok { --c: var(--k); }
.card .quote { font: 600 18px var(--sans); color: #fff; }
.card .intent { font: 800 20px var(--mono); color: var(--k); text-shadow: 0 0 16px var(--k); }
.card .kv { font: 600 11px var(--mono); padding: 3px 8px; border-radius: 7px; background: rgba(255, 255, 255, .06); border: 1px solid rgba(255, 255, 255, .1); animation: pop .35s backwards; }
.card .kv i { font-style: normal; color: var(--dim); }
.card .mono { font: 600 12px var(--mono); color: #ffe7a3; word-break: break-all; }
.card .verdict { font: 900 34px var(--mono); }
.card .answer { font: 600 15px/1.45 var(--sans); color: #fff; }
.card svg { width: 100%; height: 210px; display: block; }
.card .reject { font: 900 56px var(--mono); color: var(--bad); text-shadow: 0 0 30px var(--bad); text-align: center; }

/* ── bottom: transformation chain + answer ─────────────── */
#bottom {
  display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center;
  padding: 10px 18px;
  border-top: 1px solid var(--faint);
  background: linear-gradient(0deg, rgba(10, 16, 34, .92), rgba(4, 7, 15, .6));
  z-index: 20;
}
#chain { display: flex; align-items: center; gap: 6px; }
.link {
  width: 92px; height: 70px; border-radius: 12px;
  border: 1px solid rgba(130, 160, 255, .14);
  padding: 7px 8px; overflow: hidden;
  opacity: .32; transition: opacity .3s, border-color .3s, box-shadow .3s, transform .3s;
}
.link.on { opacity: 1; border-color: var(--k); box-shadow: 0 0 22px -6px var(--k); transform: translateY(-2px); }
.link .t { font: 800 9px var(--mono); letter-spacing: .12em; color: var(--k); }
.link .v { font: 700 12px/1.25 var(--mono); color: var(--ink); margin-top: 6px; word-break: break-all; max-height: 32px; overflow: hidden; }
.arrow { color: #36406a; font: 700 14px var(--mono); }
#answer {
  min-width: 0;
  font: 600 19px/1.4 var(--sans);
  color: #fff;
  text-shadow: 0 0 22px rgba(244, 114, 182, .45);
  overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
}
#answer.fallback { color: #ffd38a; text-shadow: 0 0 22px rgba(251, 191, 36, .45); }
#answer.reject { color: #ffb4b4; text-shadow: 0 0 22px rgba(248, 113, 113, .5); }
#answer .cursor { display: inline-block; width: 9px; height: 1.05em; background: #f472b6; vertical-align: -3px; animation: blink .7s infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* ── floating labels ───────────────────────────────────── */
.float {
  position: absolute; z-index: 70; pointer-events: none;
  font: 900 18px var(--mono); color: var(--c);
  text-shadow: 0 0 18px var(--c);
  animation: rise 1.4s forwards;
}
.float small { display: block; font: 600 9px var(--mono); color: var(--dim); text-shadow: none; }
@keyframes rise { from { opacity: 0; transform: translateY(8px) scale(.7); } 15% { opacity: 1; transform: none; } to { opacity: 0; transform: translateY(-26px); } }

/* ── picker overlay ────────────────────────────────────── */
#picker {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(2, 4, 10, .72); backdrop-filter: blur(6px);
  display: none; place-items: center;
}
#picker.open { display: grid; }
#pick {
  width: min(760px, 92vw); max-height: 80vh;
  display: flex; flex-direction: column;
  border-radius: 18px; border: 1px solid rgba(138, 180, 255, .35);
  background: rgba(7, 11, 24, .96); box-shadow: 0 30px 90px -30px #3b82f6;
  overflow: hidden;
}
#search {
  margin: 14px; padding: 12px 14px; border-radius: 12px;
  border: 1px solid rgba(138, 180, 255, .3); background: rgba(20, 30, 60, .5);
  color: var(--ink); font: 600 16px var(--sans); outline: none;
}
#list { overflow: auto; padding: 0 8px 12px; }
.opt {
  display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center;
  width: 100%; text-align: left; padding: 8px 10px; border-radius: 10px;
  border: 0; background: transparent;
}
.opt:hover, .opt.cur { background: rgba(80, 110, 200, .22); }
.opt .n { font: 600 11px var(--mono); color: var(--dim); }
.opt .s { font: 500 14px var(--sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.opt .b { font: 700 10px var(--mono); padding: 2px 7px; border-radius: 99px; color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); }

#empty { display: none; place-items: center; font: 700 18px var(--mono); color: var(--dim); }
body.empty > * { display: none; }
body.empty #empty { display: grid; height: 100vh; }
</style>
</head>

<div id="bar">
  <span class="chip" id="impl"></span>
  <button class="ctl" id="prev" title="câu trước (←)">◀</button>

</div>

</div>

<div id="picker"><div id="pick"><input id="search" placeholder="tìm câu…" autocomplete="off"><div id="list"></div></div></div>

<script>
"use strict";
const T = window.TRACE;
if (!T) document.body.classList.add("empty");

const $ = (s) => document.querySelector(s);
const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
};

/* ── data ─────────────────────────────────────────────────── */
const MOD = T ? T.modules : {};
const ROOT = T ? T.root : "run";
const J = T ? T.journeys : [];
const names = Object.keys(MOD);
const kids = (n) => names.filter((k) => MOD[k].parent === n).sort((a, b) => MOD[a].order - MOD[b].order);
const desc = (n) => kids(n).reduce((s, k) => s + 1 + desc(k), 0);
const isContainer = (n) => kids(n).length > 0;

const KIND = {
  text:     { c: "#ffffff", t: "TEXT" },
  tokens:   { c: "#22d3ee", t: "TOKENS" },
  tree:     { c: "#4ade80", t: "PARSE TREE" },
  frame:    { c: "#a78bfa", t: "SEMANTIC FRAME" },
  resolved: { c: "#e879f9", t: "CONTEXT RESOLVED" },
  result:   { c: "#fbbf24", t: "QUERY RESULT" },
  answer:   { c: "#f472b6", t: "ANSWER" },
  id:       { c: "#a3e635", t: "ENTITY ID" },
  memory:   { c: "#2dd4bf", t: "DIALOGUE MEMORY" },
};
const CHAIN = ["text", "tokens", "tree", "frame", "resolved", "result", "answer"];
const PALETTE = ["#60a5fa", "#38bdf8", "#22d3ee", "#34d399", "#4ade80", "#a3e635", "#a78bfa",
                 "#e879f9", "#fb923c", "#f472b6", "#2dd4bf", "#facc15", "#818cf8", "#f87171",
                 "#94a3b8", "#c084fc", "#fda4af", "#5eead4"];
const COLOR = {};
names.slice().sort((a, b) => MOD[a].order - MOD[b].order).forEach((n, i) => { COLOR[n] = PALETTE[i % PALETTE.length]; });
COLOR[ROOT] = "#7c8db8";
if (COLOR.cli) COLOR.cli = "#93a7d8";

/* ── layout: nested boxes ─────────────────────────────────── */
const PAD = 12, HEAD = 32, GAP = 12;
let R = {};
const DOM = {};

function place(n, r) {
  R[n] = r;
  const ks = kids(n);
  if (!ks.length) return;
  const inner = { x: r.x + PAD, y: r.y + HEAD, w: r.w - 2 * PAD, h: r.h - HEAD - PAD };
  let flow = ks.filter((k) => MOD[k].order < 1000);
  const idle = ks.filter((k) => MOD[k].order >= 1000);
  if (idle.length && flow.length) {
    const sh = Math.max(46, Math.min(66, inner.h * 0.16));
    lineUp(idle, { x: inner.x, y: inner.y + inner.h - sh, w: inner.w, h: sh });
    grid(flow, { x: inner.x, y: inner.y, w: inner.w, h: inner.h - sh - GAP });
  } else {
    grid(flow.length ? flow : idle, inner);
  }
}
function lineUp(list, r) {
  const w = (r.w - GAP * (list.length - 1)) / list.length;
  list.forEach((k, i) => place(k, { x: r.x + i * (w + GAP), y: r.y, w, h: r.h }));
}
function grid(list, r) {
  const wt = (k) => 1 + 1.5 * desc(k);
  const total = list.reduce((s, k) => s + wt(k), 0);
  let rows = 1, best = Infinity;
  for (let n = 1; n <= list.length; n++) {
    const score = Math.abs(Math.log((r.w / (list.length / n)) / (r.h / n) / 1.6));
    if (score < best) { best = score; rows = n; }
  }
  const target = total / rows, out = [];
  let cur = [], acc = 0;
  list.forEach((k, i) => {
    const rowsLeft = rows - out.length - 1;
    if (cur.length && rowsLeft > 0 && list.length - i >= rowsLeft && acc + wt(k) - target > target - acc) {
      out.push(cur); cur = []; acc = 0;
    }
    cur.push(k); acc += wt(k);
  });
  if (cur.length) out.push(cur);
  const rh = out.map((row) => Math.sqrt(Math.max(...row.map(wt))));
  const sumH = rh.reduce((a, b) => a + b, 0);
  const availH = r.h - GAP * (out.length - 1);
  let y = r.y;
  out.forEach((row, ri) => {
    const h = availH * rh[ri] / sumH;
    const sw = row.reduce((s, k) => s + wt(k), 0);
    const availW = r.w - GAP * (row.length - 1);
    let x = r.x;
    row.forEach((k) => { const w = availW * wt(k) / sw; place(k, { x, y, w, h }); x += w + GAP; });
    y += h + GAP;
  });
}

function depth(n) { let d = 0; while (MOD[n] && MOD[n].parent) { n = MOD[n].parent; d++; } return d; }

function build() {
  const host = $("#boxes");
  host.textContent = "";
  for (const n of names) {
    const m = MOD[n];
    const box = el("div", "box");
    box.style.setProperty("--c", COLOR[n]);
    box.style.zIndex = 10 + depth(n);
    if (isContainer(n)) box.classList.add("container");
    if (m.order >= 1000) box.classList.add("idle");
    const head = el("div", "head");
    if (isContainer(n)) head.append(el("span", "core"));
    head.append(el("span", "name", n + ".py"));
    const what = m.classes[0] || m.functions[0] || "";
    head.append(el("span", "meta", `${m.lines} dòng${what ? " · " + what : ""}`));
    head.append(el("span", "grow"));
    const hits = el("span", "hits", "0");
    head.append(hits);
    box.append(head);
    const body = el("div", "body");
    box.append(body);
    host.append(box);
    DOM[n] = { box, hits, body, count: 0 };
  }
  widgets();
}

function positions() {
  const vp = $("#viewport");
  const W = vp.clientWidth, H = vp.clientHeight;
  const loose = names.filter((k) => !MOD[k].parent && k !== ROOT);
  const side = loose.length ? 150 : 0;
  R = {};
  place(ROOT, { x: 14, y: 14, w: W - 28 - side, h: H - 28 });
  loose.forEach((k, i) => { R[k] = { x: W - side, y: 14 + i * 92, w: side - 14, h: 78 }; });
  for (const n of names) {
    const r = R[n], s = DOM[n].box.style;
    if (!r) { s.display = "none"; continue; }

  if (p.kind === "memory") setMemory(v);
  if (p.kind === "resolved" && v.trace) {
    const used = /chương sau|chương/.test(v.trace) ? "last_chapter" : /phần/.test(v.trace) ? "last_assignment_part" : /learning|LO/.test(v.trace) ? "last_lo" : null;
    setMemory(memoryBefore(index), used);
  }
  if (p.kind === "result") {
    if (W.verdict) {
      W.verdict.textContent = v.found ? "✓" : "✗";
      W.verdict.style.color = v.found ? "var(--ok)" : "var(--bad)";
      W.query.textContent = v.query;
    }
    if (W.files && v.sources.length && R.kb) {
      v.sources.forEach((s) => W.files[s] && W.files[s].classList.add("lit"));
      DOM.kb.box.classList.add("lit");
      beams.push({ a: anchor("kb"), b: anchor(n), t0: sim, dur: 1400, color: COLOR.kb });
      hit("kb");
    }
    if (!v.found) shake();
  }
  if (p.kind === "answer" && W.answer && n === "answer") {
    W.answer.textContent = FALLBACKS(v) ? "∅" : "✓";
  }
  if (p.kind === "tree" && !v.accepted) shake();
  burstSparks(anchor(n), KIND[p.kind].c, 26, 1.4);
  await sleep(DWELL[p.kind] || 700);
  if (id === run) hideCard();
}

async function burst(h, id) {
  setActive(h.from);
  const a = anchor(h.from), jobs = [];
  let total = 0;
  for (const [target, calls] of Object.entries(h.targets)) {
    const count = Object.values(calls).reduce((s, x) => s + x, 0);
    total += count;
    const n = Math.min(count, 42), span = Math.min(1100, 200 + n * 26);
    const fnames = Object.keys(calls).map((f) => f.split(".").pop()).join(" / ");
    floatLabel(target, "×" + count.toLocaleString("vi-VN"), fnames);
    if (DOM[target]) DOM[target].box.classList.add("lit");
    for (let i = 0; i < n; i++) {
      jobs.push(sleep((i * span) / n).then(() => {
        if (id !== run) return;
        const r = R[target];
        const b = r ? { x: r.x + r.w * (0.25 + Math.random() * 0.5), y: r.y + r.h * (0.35 + Math.random() * 0.45) } : anchor(target);
        return fly(a, b, COLOR[target], { dur: 300 + Math.random() * 140, size: 3, arc: 0.45 }).then(() => {
          if (id !== run) return;
          burstSparks(b, COLOR[target], 3, 0.6);
          hit(target, count / n);
          bumpCounter(target, count / n);
        });
      }));
    }
  }
  if (total > 200) shake();
  await Promise.all(jobs);
}

function finale(j) {
  const ans = j.answer;
  const cls = j.branch == null ? "reject" : FALLBACKS(ans) ? "fallback" : "";
  typeAnswer(ans, cls);
  const p = anchor("cli");
  const color = cls === "reject" ? "#f87171" : cls === "fallback" ? "#fbbf24" : "#f472b6";
  burstSparks(p, color, 60, 2.4);
  ring(p, color, 160); ring(p, "#ffffff", 90);
  hit("cli");
}

/* ── controls ─────────────────────────────────────────────── */
function setPaused(v) { paused = v; $("#play").textContent = paused ? "▶" : "❚❚"; $("#play").classList.toggle("on", paused); }
function setSpeed(dir) {
  const i = Math.max(0, Math.min(SPEEDS.length - 1, SPEEDS.indexOf(speed) + dir));
  speed = SPEEDS[i]; $("#speed").textContent = speed + "×";
}
function cycleSpeed() { speed = SPEEDS[(SPEEDS.indexOf(speed) + 1) % SPEEDS.length]; $("#speed").textContent = speed + "×"; }
function setStream(v) { stream = v; $("#stream").classList.toggle("on", v); }

$("#prev").onclick = () => play(index - 1);
$("#next").onclick = () => play(index + 1);
$("#replay").onclick = () => play(index);
$("#play").onclick = () => setPaused(!paused);
$("#speed").onclick = cycleSpeed;
$("#stream").onclick = () => setStream(!stream);
$("#q").onclick = () => openPicker();

function openPicker() {
  $("#picker").classList.add("open");
  $("#search").value = ""; fillList(""); $("#search").focus();
}
function closePicker() { $("#picker").classList.remove("open"); }
function fillList(q) {
  const host = $("#list"); host.textContent = "";
  const needle = q.trim().toLowerCase();
  J.forEach((j, i) => {
    if (needle && !j.sentence.toLowerCase().includes(needle) && !(j.branch || "").toLowerCase().includes(needle)) return;
    const b = el("button", "opt" + (i === index ? " cur" : ""));
    const branch = el("span", "b", j.branch ? j.branch.replace("Q_", "") : "()");
    branch.style.setProperty("--c", j.branch == null ? "#f87171" : j.found ? "#4ade80" : "#fbbf24");
    b.append(el("span", "n", String(i + 1)), el("span", "s", j.sentence), branch);
    b.onclick = () => { closePicker(); play(i); };
    host.append(b);
  });
}
$("#search").oninput = (e) => fillList(e.target.value);
$("#picker").onclick = (e) => { if (e.target.id === "picker") closePicker(); };

addEventListener("keydown", (e) => {
  if ($("#picker").classList.contains("open")) {
    if (e.key === "Escape") closePicker();
    if (e.key === "Enter") { const first = $("#list .opt"); if (first) first.click(); }
    return;
  }
  if (e.key === " ") { e.preventDefault(); setPaused(!paused); }
  else if (e.key === "ArrowRight") play(index + 1);
  else if (e.key === "ArrowLeft") play(index - 1);
  else if (e.key === "r" || e.key === "R") play(index);
  else if (e.key === "s" || e.key === "S") setStream(!stream);
  else if (e.key === "+" || e.key === "=") setSpeed(1);
  else if (e.key === "-") setSpeed(-1);
  else if (e.key === "/") { e.preventDefault(); openPicker(); }
});

let resizeTimer = 0;
new ResizeObserver(() => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { positions(); flights.length = 0; }, 80);
}).observe($("#viewport"));

/* ── boot ─────────────────────────────────────────────────── */
if (T) {
  $("#impl").append(el("b", null, "demo"), document.createTextNode(` · ${J.length} câu`));
  build();
  positions();
  buildChain();
  requestAnimationFrame((t) => { last = t; frame(t); });
  play(0);
}
</script>
